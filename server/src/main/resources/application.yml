spring:
  application:
    name: healthyrolls
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jpa:
    open-in-view: false

pricing:
  delivery-fee: ${DELIVERY_FEE:2.99}
  service-fee: ${SERVICE_FEE:1.99}
  small-order-threshold: ${SMALL_ORDER_THRESHOLD:15.00}
  small-order-surcharge: ${SMALL_ORDER_SURCHARGE:2.50}

healthyrolls:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
      ttl: 1h

    access:
      rules:
        # REG
        - { path-pattern: /api/users/register, method: POST, is-public: true }
        - { path-pattern: /api/users/login, method: POST, is-public: true }
        - { path-pattern: /api/users/me, method: GET, allowed-rules: [CUSTOMER, RESTAURANT_STAFF, COURIER, OPERATOR] }

        # ORD
        - { path-pattern: /api/restaurants/**, method: GET, allowed-rules: [CUSTOMER, RESTAURANT_STAFF, OPERATOR] }
        - { path-pattern: /api/restaurants/*/menu/**, method: PUT, allowed-rules: [RESTAURANT_STAFF] }
        - { path-pattern: /api/restaurants/*/menu, method: POST, allowed-rules: [RESTAURANT_STAFF] }
        - { path-pattern: /api/restaurants/*/pause, method: POST, allowed-rules: [RESTAURANT_STAFF, OPERATOR] }
        - { path-pattern: /api/restaurants/*/reopen, method: POST, allowed-rules: [OPERATOR] }

        - { path-pattern: /api/orders/preparation/next, method: POST, allowed-rules: [RESTAURANT_STAFF] }
        - { path-pattern: /api/orders/*/actions, method: POST, allowed-rules: [CUSTOMER, RESTAURANT_STAFF, COURIER, OPERATOR] }
        - { path-pattern: /api/orders, method: POST, allowed-rules: [CUSTOMER] }
        - { path-pattern: /api/orders/**, method: GET, allowed-rules: [CUSTOMER, RESTAURANT_STAFF, OPERATOR] }

        - { path-pattern: /api/events/**, method: GET, allowed-rules: [CUSTOMER, RESTAURANT_STAFF, OPERATOR] }

        # PRC
        - { path-pattern: /api/billing/history, method: GET, allowed-rules: [CUSTOMER, RESTAURANT_STAFF, COURIER, OPERATOR] }
        - { path-pattern: /api/billing/customers/*/history, method: GET, allowed-rules: [CUSTOMER, OPERATOR] }
        - { path-pattern: /api/billing/orders/*, method: GET, allowed-rules: [CUSTOMER, RESTAURANT_STAFF, COURIER, OPERATOR] }
        - { path-pattern: /api/billing/orders/*/refund, method: POST, allowed-rules: [OPERATOR] }

        # Operator
        - { path-pattern: /api/admin/reset, method: POST, allowed-rules: [OPERATOR] }
